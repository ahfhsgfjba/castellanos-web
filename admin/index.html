<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin CMS | Castellanos Tile and Remodeling Services</title>
  <link rel="icon" type="image/png" href="../Castellanos icon-favicon.png">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <noscript>
    <p style="color:#fff;padding:24px">JavaScript is required to use the website CMS.</p>
  </noscript>
  <div class="cms-loading-card" style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#071927;color:#F7F7F5;font-family:system-ui,sans-serif">
    <div style="max-width:560px;background:#fff;color:#071927;border-radius:16px;padding:28px;box-shadow:0 22px 60px rgba(0,0,0,.25)">
      <img src="../Castellanos Logo horizontal.png" alt="Castellanos logo" style="width:230px;max-width:100%;margin-bottom:18px">
      <p style="margin:0 0 8px;color:#B88A44;font-weight:900;text-transform:uppercase;letter-spacing:.1em;font-size:12px">Website CMS</p>
      <h1 style="margin:0 0 12px;font-size:32px;line-height:1.05">Loading content editor</h1>
      <p style="margin:0 0 18px;color:#4f5965;line-height:1.6">Use the visual dashboard first if you want to understand where each section appears before editing.</p>
      <a href="../dashboard/" style="display:inline-flex;background:#fab515;color:#071927;border-radius:10px;padding:12px 16px;font-weight:900;text-decoration:none">Open Visual Dashboard</a>
    </div>
  </div>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>
  <script src="admin.js"></script>
</body>
</html>
