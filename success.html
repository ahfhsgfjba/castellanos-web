<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Request Sent | Castellanos Tile and Remodeling Services</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #071927;
      --charcoal: #2B3440;
      --warm-white: #F7F7F5;
      --gold: #fab515;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Montserrat, Arial, sans-serif;
      color: var(--navy);
      background:
        linear-gradient(135deg, rgba(247, 247, 245, .94), rgba(247, 247, 245, .82)),
        url("assets/hero-remodel.jpg") center / cover fixed;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(28px, 6vw, 52px);
      border: 1px solid rgba(7, 25, 39, .12);
      border-radius: 8px;
      background: rgba(247, 247, 245, .94);
      box-shadow: 0 24px 70px rgba(7, 25, 39, .16);
      text-align: center;
    }

    img {
      width: min(310px, 84%);
      height: auto;
      margin-bottom: 28px;
    }

    p:first-of-type {
      margin: 0 0 10px;
      color: var(--gold);
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 58px);
      line-height: .95;
    }

    p:last-of-type {
      margin: 22px auto 32px;
      max-width: 520px;
      color: var(--charcoal);
      font-size: 18px;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 0 24px;
      border-radius: 8px;
      color: var(--navy);
      background: var(--gold);
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="Castellanos Logo horizontal.png" alt="Castellanos Tile and Remodeling Services">
    <p>Request Sent</p>
    <h1>Thank You</h1>
    <p>Your remodeling quote request was received. The Castellanos team will review your project details and contact you soon.</p>
    <a href="/">Back to Website</a>
  </main>
</body>
</html>
